name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  setup:
    name: Install dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Test
        run: npm test

  contrast:
    name: Contrast
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Check contrast
        run: npm run check-contrast

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build
        run: npm run build

      - name: Build CLI
        run: npm run build --workspace=packages/cli

      - name: Sync CLI registry
        run: npm run sync-registry

      - name: Validate components
        run: node scripts/validate-components.mjs
