name: Visual

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update:
        description: Regenerate baseline screenshots and upload them as an artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.59.1-noble
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Compare screenshots
        if: ${{ !inputs.update }}
        run: npm run test:visual

      - name: Build PR comment
        if: ${{ !cancelled() && !inputs.update && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/visual-comment.mjs playwright-results.json visual-comment.md

      - name: Post PR comment
        if: ${{ !cancelled() && !inputs.update && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('visual-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body.includes('<!-- visual-regression -->'));

            if(existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Update screenshots
        if: ${{ inputs.update }}
        run: npm run test:visual:update

      - name: Upload baselines
        if: ${{ inputs.update }}
        uses: actions/upload-artifact@v4
        with:
          name: baselines
          path: e2e/snapshots

      - name: Upload report
        if: ${{ !cancelled() && !inputs.update }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
